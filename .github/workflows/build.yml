name: Build

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install Android platform (runner ships the SDK; just add what we compile against)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-37.2" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: afterbeep-debug
          path: app/build/outputs/apk/debug/app-debug.apk
